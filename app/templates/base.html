<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Watchdog - Status Dashboard{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; }
        header { background: #2c3e50; color: white; padding: 1rem; }
        nav { display: flex; gap: 1rem; }
        nav a { color: white; text-decoration: none; padding: 0.5rem 1rem; }
        nav a:hover { background: #34495e; border-radius: 4px; }
        main { padding: 2rem; }
        .container { max-width: 1200px; margin: 0 auto; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Watchdog Service Monitor</h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/admin/tools">Admin Tools</a>
                <a href="/admin/config">Config</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
