{% extends "base.html" %}
{% block title %}Configuration — Watchdog Admin{% endblock %}
{% block subnav %}admin / config{% endblock %}

{% block content %}
<div class="page-header">
  <span class="page-title">Global Configuration</span>
</div>

<form method="post" class="wd-card">
  <div class="wd-field">
    <label class="wd-label">SMTP Host</label>
    <input class="wd-input" type="text" name="smtp_host"
           value="{{ config.smtp_host or '' }}" placeholder="mail.example.com">
  </div>
  <div class="wd-field">
    <label class="wd-label">SMTP Port</label>
    <input class="wd-input" type="number" name="smtp_port"
           value="{{ config.smtp_port }}" min="1" max="65535">
  </div>
  <div class="wd-field">
    <label class="wd-label">Alert Emails (Semikolon-getrennt)</label>
    <textarea class="wd-input" name="alert_emails">{{ config.alert_emails or '' }}</textarea>
  </div>
  <div class="wd-field">
    <label class="wd-label">Check Interval (Minuten)</label>
    <input class="wd-input" type="number" name="check_interval_minutes"
           value="{{ config.check_interval_minutes }}" min="1">
  </div>
  <div class="wd-field" style="margin-bottom:24px">
    <label class="wd-label">Monatliche Toleranz (Tage)</label>
    <input class="wd-input" type="number" name="monthly_grace_days"
           value="{{ config.monthly_grace_days }}" min="0" max="28">
  </div>
  <div style="display:flex;gap:8px">
    <button type="submit" class="wd-btn wd-btn-primary">Speichern</button>
    <button type="button" onclick="testEmail()" class="wd-btn wd-btn-warn">Test E-Mail</button>
  </div>
</form>

<script>
async function testEmail() {
  const resp = await fetch('/admin/config/test-email', {method: 'POST'});
  const data = await resp.json();
  if (resp.ok) {
    alert('Test-Mail gesendet an: ' + (document.querySelector('textarea[name="alert_emails"]').value.split(';')[0] || 'N/A'));
  } else {
    alert('Fehler: ' + (data.error || 'Unbekannter Fehler'));
  }
}
</script>
{% endblock %}
